name: billify
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  fl_chart: ^1.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6
  permission_handler: ^12.0.1
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  file_picker: ^10.2.0
  open_file: ^3.5.10
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.4
  dio: ^5.9.2
  flutter_riverpod: ^3.3.1
  google_sign_in: ^7.2.0
  google_fonts: ^8.1.0
  mobile_scanner: ^7.2.0
  flutter_contacts: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  package_rename: ^1.10.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/billify.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/billify.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/billify.png
  android: true
  ios: true
  web: true

package_rename_config:
  android:
    app_name: "Billify"
    package_name: "com.allysoftsolutions.billify"
    override_old_package: "com.billify.application"
    lang: kotlin

  ios:
    app_name: "Billify"
    bundle_name: "Billify"
    package_name: "com.allysoftsolutions.billify"

  web:
    app_name: "Billify"
    short_app_name: "Billify"
    description: "Manage your small shop products and payments easily"

  linux:
    app_name: "Billify"
    package_name: "com.allysoftsolutions.billify"
    exe_name: "billify"

  windows:
    app_name: "Billify"
    organization: "Ally Soft Solutions"
    copyright_notice: "Copyright © 2026 Ally Soft Solutions"

  macos:
    app_name: "Billify"
    package_name: "com.allysoftsolutions.billify"